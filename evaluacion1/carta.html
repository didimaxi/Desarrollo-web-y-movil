<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dulce Tentación | Carta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body data-pagina="carta">
<header id="navbar"></header>
<main class="container">
  <h1 class="mb-3">Pide aquí</h1>
  <div id="estado"></div>
  <div id="contenido">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
      <div class="chips" id="chips"></div>
      <div class="flex-shrink-0" style="max-width: 20rem; width: 100%;">
        <label class="visually-hidden" for="buscar">Buscar producto</label>
        <input class="form-control" id="buscar" type="search" placeholder="Buscar producto">
      </div>
    </div>
    <div class="row g-3" id="lista"></div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
