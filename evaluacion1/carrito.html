<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dulce Tentación | Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body data-pagina="carrito">
<header id="navbar"></header>
<main class="container">
  <h1 class="mb-4">Tu carrito</h1>
  <div id="mensaje"></div>
  <div id="vacio" class="estado d-none">
    <p class="mb-0">Tu carrito está vacío.</p>
    <a class="btn btn-dt" href="carta.html">Ver la carta</a>
  </div>
  <div id="con-items" class="row g-4 d-none">
    <section class="col-12 col-lg-7" aria-label="Productos del carrito"><div id="lineas"></div></section>
    <aside class="col-12 col-lg-5">
      <form id="form-pedido" class="panel" novalidate>
        <h2 class="h4 mb-3">Tus datos</h2>
        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input class="form-control" id="nombre" name="nombre" required minlength="3">
          <div class="invalid-feedback">Ingresa tu nombre.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Correo</label>
          <input class="form-control" id="email" name="email" type="email" required>
          <div class="invalid-feedback">Ingresa un correo válido.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" id="telefono" name="telefono" type="tel" required pattern="[0-9+ ]{8,15}">
          <div class="invalid-feedback">Ingresa un teléfono de 8 a 15 dígitos.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="tipo">Entrega</label>
          <select class="form-select" id="tipo" name="tipo">
            <option value="retiro">Retiro en tienda</option>
            <option value="despacho">Despacho a domicilio</option>
          </select>
        </div>
        <div class="mb-3 d-none" id="campo-dir">
          <label class="form-label" for="direccion">Dirección</label>
          <input class="form-control" id="direccion" name="direccion">
          <div class="invalid-feedback">Ingresa la dirección de despacho.</div>
        </div>
        <div class="d-flex align-items-center justify-content-between fs-5 mb-3">
          <span>Total</span><strong id="total"></strong>
        </div>
        <button class="btn btn-dt w-100" id="btn-confirmar" type="submit">Confirmar pedido</button>
      </form>
    </aside>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
